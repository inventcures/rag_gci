# Nixpacks build plan for Railway (and any Nixpacks-compatible host).
# Only the review_app is deployed — the large root-level RAG dependencies
# (chromadb, neo4j, sarvam, etc.) are NOT needed for the review console.

[phases.setup]
nixPkgs = ["python313", "gcc"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --no-cache-dir -r review_app/requirements.txt",
]

[start]
cmd = "cd review_app && /opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port ${PORT:-8005}"

[variables]
PYTHON_VERSION = "3.13"
