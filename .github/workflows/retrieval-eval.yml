# Measures the configured embedding model before it can reach the index.
#
# ADR 0008 replaces bge-m3 with EmbeddingGemma 2 on the strength of vendor
# benchmarks, and vendor benchmarks have already been wrong for this corpus once:
# LaBSE, tuned on 22 Indian languages, lost to bge-m3 0.72 to 0.96 (ADR 0003).
# So the swap is gated on the same 99 clinical probes in all eleven languages.
#
# On a pass, the knowledge index is rebuilt with the new model and committed to
# the pull request, so the merged branch never pairs a new model with an old
# index. On a failure nothing is rebuilt and the job stays red.

name: Retrieval eval

on:
  pull_request:
    paths:
      - config.yaml
      - retrieval_embeddings.py
      - retrieval_index.py
      - reindex_service.py
      - requirements.txt
      - evaluation/retrieval_eval/**
      - .github/workflows/retrieval-eval.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: Embedding model gate (11 languages)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The branch itself, not the merge commit, so a rebuilt index can be
          # committed back onto it.
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU-only dependencies
        # CPU torch keeps the install to minutes; the eval runs on CPU anyway,
        # which is also how the server runs it. Pillow and torchvision as in
        # requirements.txt: EmbeddingGemma 2's processor imports both even for
        # text-only use.
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "sentence-transformers>=6.1.0" transformers "chromadb>=1.5.0" pyyaml numpy "Pillow>=10.1.0"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('evaluation/retrieval_eval/run_eval.py', 'retrieval_embeddings.py') }}
          restore-keys: hf-

      - name: Measure EmbeddingGemma 2 against bge-m3
        run: |
          set -o pipefail
          python evaluation/retrieval_eval/run_eval.py --gate \
            --models embeddinggemma-2,bge-m3 \
            --out evaluation/retrieval_eval/results_adr0008.json | tee eval.txt
        env:
          PYTHONUNBUFFERED: "1"

      - name: Publish the measurement
        if: always()
        run: |
          {
            echo '## Retrieval eval (ADR 0008)'
            echo '```'
            cat eval.txt 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-eval
          path: evaluation/retrieval_eval/results_adr0008.json
          if-no-files-found: ignore

      - name: Rebuild the knowledge index with the configured model
        # The gold labels are chunk positions, so the rebuild must keep the
        # chunk order. Checked rather than assumed.
        run: |
          python - <<'EOF' > before.txt
          import chromadb, retrieval_embeddings
          c = chromadb.PersistentClient(path="./data/chroma_db").get_collection("documents")
          print("\n".join(c.get(include=["documents"])["documents"]))
          EOF
          python scripts/reindex_with_configured_model.py --yes
          python - <<'EOF' > after.txt
          import chromadb, retrieval_embeddings
          c = chromadb.PersistentClient(path="./data/chroma_db").get_collection("documents")
          print("\n".join(c.get(include=["documents"])["documents"]))
          EOF
          cmp before.txt after.txt

      - name: Commit the measurement and the rebuilt index
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/retrieval_eval/results_adr0008.json data/chroma_db
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "data: rebuild knowledge index with the configured embedding model" \
                       -m "Measured by the retrieval-eval gate: evaluation/retrieval_eval/results_adr0008.json"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
