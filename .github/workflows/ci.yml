# Checks that fail the build.
#
# Each of these exists because something once looked correct and was not.
#
# The secret scan is not theatre: this repository is public, and a clinical study
# system is exactly the kind of thing where one careless `git add -f` publishes a
# credential or a participant record permanently.
#
# Everything here runs on free Actions minutes. Public repositories are unmetered.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # requirements.txt minus the two entries that cannot be installed.
        #
        # Three entries cannot be installed: ktem and kotaemon are 404 on PyPI
        # because they ship with the vendored kotaemon-main tree, and
        # whisper-openai>=20231117 names a version that was never published, so only
        # 1.0.0 resolves. Rather than hand-maintaining a second list that drifts,
        # the impossible entries are filtered out of the real one, so a dependency
        # added for a new feature reaches CI without anyone remembering to add it
        # twice.
        run: |
          grep -vE '^(ktem|kotaemon)\s*$|^whisper-openai' requirements.txt > /tmp/req.txt
          echo "filtered requirements:"; wc -l < /tmp/req.txt
          pip install -r /tmp/req.txt

      - name: Run the suite
        # The count is asserted, not just the exit code. Twice in this project a run
        # reported success while collecting nothing at all, which a bare exit code
        # cannot tell apart from a real pass.
        run: |
          python -m pytest --tb=short
          COUNT=$(python -m pytest --collect-only -q 2>/dev/null | tail -1)
          echo "collected: $COUNT"
          case "$COUNT" in
            *"error"*|*"no tests ran"*) echo "nothing was collected"; exit 1 ;;
          esac

  docs-current:
    name: Generated docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the imports the generator needs
        # build_docs.py imports mobile_api.router to read the real route table.
        # Without these it degrades to a single "(unavailable)" row, so the gate
        # fails on a page that is in fact current. The failure looks like staleness
        # and is not staleness.
        run: pip install fastapi pydantic python-multipart

      - name: Fail if the generated reference is stale
        # The reference is generated from the code so it cannot drift. That only
        # holds if something notices when it does.
        run: python scripts/build_docs.py --check

  android:
    name: Android unit tests and contract gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android SDK explicitly
        # Not android-actions/setup-android. That action validates the version of the
        # sdkmanager preinstalled on the runner image and aborts with "Wrong version
        # in preinstalled sdkmanager" when it disagrees. Pinning the command line
        # tools removes the dependency on whatever the image happens to ship.
        env:
          ANDROID_CMDLINE_VERSION: "11076708"
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_VERSION}_latest.zip"
          rm -rf /tmp/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the server imports the contract gate needs
        # Both contract gates shell out to scripts/export_openapi_contract.py, which
        # imports the FastAPI app, and the app imports auth, which imports PyJWT.
        # A hand-kept list of these was tried and missed jwt, so the gate failed on
        # a missing module while saying nothing about contract drift, which is the
        # one thing this gate exists to report. The same filtered requirements the
        # Python job uses is applied here instead, so it cannot drift out of sync.
        run: |
          grep -vE '^(ktem|kotaemon)\s*$|^whisper-openai' requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt

      - name: Release build and size budget
        working-directory: android-app
        # Criterion 8. The size budget is a field constraint, so it is checked rather
        # than stated. R8 currently takes 10.1 MB of debug output down to 1.61 MB,
        # which is about 84 seconds of sustained 2G. A dependency added without
        # noticing is invisible until this fails.
        run: |
          ./gradlew :app:assembleRelease
          python ../scripts/check_apk_budget.py

      - name: Unit tests, contract drift and generated client
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
                    :core:api:verifyApiContract \
                    :core:api:verifyGeneratedClient \
                    :app:assembleDebug

  dosage-evidence:
    name: Dosage restriction evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: No user-facing English literals
        # Criterion 4. Auditing this by reading found three hardcoded strings in one
        # sitting, inside a Hindi app, while the criterion was already ticked. Made a
        # build failure so the next one fails the build too.
        run: python3 scripts/check_no_hardcoded_strings.py

      - name: Fail if the evidence record is stale
        # Protocol 7.7 makes this a precondition for participant use. The record is
        # generated from the tests rather than written by hand, so it cannot claim
        # coverage the code does not have. Checked in CI so deleting a safety test
        # fails the build rather than quietly shrinking the evidence.
        run: python3 scripts/dosage_evidence.py --check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan all history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}