<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Palli Sahayak Review Console{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/static/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/dashboard">Palli Sahayak — RAG Review Console</a>
      <div class="d-flex align-items-center text-light">
        {% if user %}
          <span class="me-3">
            <strong>{{ user.name }}</strong>
            <small class="text-muted">({{ user.site }})</small>
          </span>
          <a href="/dashboard" class="btn btn-sm btn-outline-light me-2">Dashboard</a>
          <a href="/progress" class="btn btn-sm btn-outline-light me-2">Progress</a>
          <a href="/export.csv" class="btn btn-sm btn-outline-light me-2">Export CSV</a>
          <a href="/logout" class="btn btn-sm btn-outline-warning">Logout</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <div class="container-fluid px-4">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
