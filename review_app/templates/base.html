<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Palli Sahayak Review Console{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/static/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/dashboard">Palli Sahayak — RAG Review Console</a>
      <div class="d-flex align-items-center text-light">
        {% if user %}
          <form method="post" action="/admin/set-version" class="d-flex align-items-center me-3" id="version-form">
            <label class="me-2 small text-light mb-0">Set:</label>
            <select name="version" class="form-select form-select-sm me-2" id="version-select" style="width:auto">
              {% for v in available_versions %}
                <option value="{{ v }}" {% if v == active_version %}selected{% endif %}>
                  {{ v }}{% if v in admin_only_versions %} (admin){% endif %}
                </option>
              {% endfor %}
            </select>
            <input type="password" name="password" placeholder="Admin password"
                   class="form-control form-control-sm me-2" id="version-password"
                   style="width: 11rem; display: none" autocomplete="off" />
            <button type="submit" class="btn btn-sm btn-outline-light me-3">Switch</button>
          </form>
          <span class="me-3">
            <strong>{{ user.name }}</strong>
            {% if user.site %}<small class="text-muted">({{ user.site }})</small>{% endif %}
          </span>
          <a href="/dashboard" class="btn btn-sm btn-outline-light me-2">Dashboard</a>
          <a href="/progress" class="btn btn-sm btn-outline-light me-2">Progress</a>
          <a href="/export.csv" class="btn btn-sm btn-outline-light me-2">Export CSV</a>
          <a href="/logout" class="btn btn-sm btn-outline-warning">Logout</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <div class="container-fluid px-4">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% if user %}
  <script>
    (function () {
      var sel = document.getElementById("version-select");
      var pw = document.getElementById("version-password");
      if (!sel || !pw) return;
      var adminVersions = {{ admin_only_versions | tojson }};
      function sync() {
        pw.style.display = adminVersions.indexOf(sel.value) >= 0 ? "" : "none";
        if (pw.style.display === "none") pw.value = "";
      }
      sel.addEventListener("change", sync);
      sync();
    })();
  </script>
  {% endif %}
  {% block scripts %}{% endblock %}
</body>
</html>
