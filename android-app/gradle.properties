# AndroidX is required by every dependency here.
android.useAndroidX=true
android.nonTransitiveRClass=true

# JVM heap sized for a developer machine that may also be running the Python
# backend. Overridable per machine rather than committed as a large fixed value.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
