# Study Release Record
#
# Protocol section 7.8: before activation, record the study release name, the
# source-code commit and any local patch, the actual model and provider
# identifiers, the speech models, prompt versions, retrieval settings, the
# knowledge-source snapshot, the enabled languages, the interface, the fallback
# policy, review approvals and the deployment time. Store that identifier with
# every interaction.
#
# This file is the human-readable half of that record. It is deliberately NOT
# self-updating: the point is to describe the system that was approved, not the
# system that happened to be running. If the live system stops matching this
# file, study_release.py warns loudly, keeps serving, and persists the drift so
# that the analysis can count how many interactions ran on an unapproved build.

release_name: "unassigned-dev"
status: draft                # draft | activated | retired

# --- Provenance -------------------------------------------------------------
source:
  commit: "83f7c9660fa5bba94908b9176e18f69abaf91453"
  local_patch: null          # set when the build differs from the commit
  prompt_version: "unversioned"   # PROMPTS.md does not exist yet; see notes

# --- Models -----------------------------------------------------------------
models:
  llm:
    provider: "gemini"
    model: "gemini-3.5-flash"
    region: "asia-south1"          # Mumbai. Verified available (ADR 0007).
    override_env: "LLM_MODEL / LLM_LOCATION (llm/client.py; config.yaml llm:)"
    fallback: "none"               # DeepSeek fallback off: China-hosted, not approved
    # Chosen over Gemini 3.8 Flash: 3.8, 3.7 and 3.6 have no Asia-Pacific
    # availability at all. 3.5 Flash is the newest model available in India.
    # The previously configured gemini-3.1-flash-lite is also unavailable in
    # Asia-Pacific, so inference was not India-resident before this decision.
    verified_asia_pacific: ["asia-south1", "asia-southeast1", "asia-northeast1", "australia-southeast1"]
    # Thinking level per purpose and deadlines (latency ticket 11). PENDING
    # STUDY APPROVAL: these change answer content. Before them every call ran at
    # the model's default level, which spent the 2048-token cap on thinking and
    # cut answers off mid-sentence after ~11 s. Measurements and the quality
    # comparison: docs/latency/thinking-11.md; reasoning: docs/decisions/latency.md.
    # Voice turns use a 60-80 word spoken prompt (ticket 12). With it, voice
    # answers at "minimal" were judged close to "high" (18 wins, 22 losses of
    # 40) and behind "low" (10 wins, 30 losses). Clinician review of the spoken
    # answers (research/latency-evals/voice-answers-review.md) is required
    # before activation.
    thinking:
      answer: low
      voice_answer: minimal
      query_translation: minimal
      answer_translation: minimal
      clarification: minimal
      default: high
    deadlines:
      default_s: 45
      translation_s: 3
      answer_translation_s: 8
      voice_s: 7
  voice_primary:
    provider: "gemini_live"
    model: "gemini-3.8-live"
    region: "not-asia-south1"
    # No Indian region offers the Live API. Verified regions: us-south1,
    # europe-west9, me-central2, southamerica-east1, asia-northeast3.
    # Raw voice audio leaves India on this path (ADR 0007).
    residency_deviation: true
  voice_fallback:
    provider: "sarvam"
    stt_model: "saaras-v3"
    tts_model: "bulbul-v3"
    region: "india"
    trigger: "first-token timeout or per-turn stall"
    # Automatic fallback on session failure or stall. Not operator-toggleable.
  query_translation:
    provider: "gemini"
    model: "gemini-3.5-flash"
    # Uses the shared LLM client (llm/client.py), same model and region as
    # answers. Replaces the Groq llama-3.1-8b-instant path recorded as defective
    # in the previous release (ADR 0003).
  embedding:
    model: "BAAI/bge-m3"
    dimensions: 1024
    source: "evaluation/retrieval_eval/results.json"
    # Chosen by measurement: mean hit@5 0.96, against 0.72 for LaBSE and 0.09
    # for the previous English-only bge-small-en-v1.5, which scored 0.00 on
    # every one of the ten Indic languages (ADR 0003).
    measured_mean_hit_at_5: 0.960
    runtime: "torch"   # retrieval/embedding_runtime.py; see ticket 17 in docs/decisions/latency.md
    self_hosted: true
    multilingual: true
  speech:
    stt:
      provider: "sarvam"
      model: "saaras-v3"
      languages: 22
    tts:
      provider: "sarvam"
      model: "bulbul-v3"
      languages: 11
      speaker_default: "priya"   # v3 uses language-agnostic speakers

# --- Knowledge source -------------------------------------------------------
knowledge:
  collection: "documents"
  chunk_count: 263
  source_documents: 3
  # The corpus is three PDFs: the NPPC Handbook for Community Health Workers
  # (106 chunks), the Neurosurgery home-care guidebook (122) and the Pallium
  # India opioid compilation (35). The Pallium document is entirely table of
  # contents, so 35 of 263 chunks carry no clinical content.
  snapshot_sha256: null        # populated once data/documents/ holds the sources
  embedding_dimension: 1024     # bge-m3; live index is still 384 until reindexed
  # OPEN: 263 chunks is thin for eleven languages and three user groups. Worth
  # confirming this is the intended knowledge base before optimising retrieval.

# --- Retrieval --------------------------------------------------------------
retrieval:
  vector_store: "chromadb"
  persist_directory: "./data/chroma_db"
  distance: "l2"
  chunk_size_chars: 1000
  reranking: true
  rag_method: "vector"
  # The grant describes GraphRAG and Neo4j contributing through Reciprocal Rank
  # Fusion. That path now exists behind --rag-method kg | graphrag | fused
  # (RRF, k=60, retrieval/fusion.py) but this release does not enable it: vector
  # retrieval is the only method on the query path. Turning it on changes
  # rag_method above and shows as RELEASE DRIFT until this record is updated.
  fusion: "none"
  # Knowledge-graph cross-reference check of drafted answers (protocol K26):
  # off | shadow | flag | block. Off in this release.
  kg_check: "off"

# --- Language ---------------------------------------------------------------
enabled_languages:
  # ADR 0002: eleven, bounded by TTS capability rather than ASR capability.
  # The grant proposes 22. The eleven below are the languages the app can both
  # hear and speak; the remaining eleven STT languages would produce a
  # Speech-Language Mismatch and are therefore not enabled.
  - hi-IN
  - bn-IN
  - kn-IN
  - ml-IN
  - mr-IN
  - od-IN
  - pa-IN
  - ta-IN
  - te-IN
  - gu-IN
  - en-IN

language_policy:
  tts_fallback_to_hindi: false   # ADR 0002: never silently substitute Hindi
  mismatch_behaviour: "answer in English or text, never substitute"

# --- Safety -----------------------------------------------------------------
safety:
  dosage_restriction: true
  dosage_boundary: "dose"        # ADR 0004
  dosage_redaction: "sentence"
  emergency_detection_languages: ["en", "hi", "bn", "ta", "gu"]

# --- Interface --------------------------------------------------------------
interface:
  mobile_api_base: "/api/mobile/v1"
  offline_cache_bundle: false

# --- Approvals --------------------------------------------------------------
# Protocol 7.7: the clinical and technical leads must approve the complete route
# before any participant uses it. Neither has signed; this release is not
# activated and must not be used with participants.
approvals:
  clinical_lead:
    name: null
    approved_at: null
  technical_lead:
    name: null
    approved_at: null

deployment:
  activated_at: null
  # Protocol 7.1: "An approved study release identifier has not yet been
  # established." This file is the first attempt at establishing one.
  notes: "Draft. Not for participant use until approvals are signed and section 7.7 checks pass."