[pytest]
testpaths = tests
# auto so the existing async tests run without each one carrying a marker.
# Under the default strict mode they were collected and then failed with a
# message about the plugin rather than about the code.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
addopts = -q
